<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">XGBoost walking test metrics</title>
  <desc id="desc">Bar chart showing accuracy 85.6 percent, F1 91.4 percent, and ROC-AUC 81.6 percent.</desc>
  <rect width="900" height="520" fill="#ffffff"/>
  <text x="60" y="52" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#111827">Walking — XGBoost</text>
  <text x="60" y="82" font-family="Arial, sans-serif" font-size="16" fill="#6b7280">Best overall classical model on the stored walking test results</text>

  <line x1="110" y1="420" x2="840" y2="420" stroke="#9ca3af" stroke-width="1.5"/>
  <line x1="110" y1="120" x2="110" y2="420" stroke="#9ca3af" stroke-width="1.5"/>

  <g font-family="Arial, sans-serif" font-size="13" fill="#6b7280">
    <text x="78" y="425">0</text>
    <text x="68" y="365">20</text>
    <text x="68" y="305">40</text>
    <text x="68" y="245">60</text>
    <text x="68" y="185">80</text>
    <text x="60" y="125">100</text>
  </g>

  <g stroke="#e5e7eb" stroke-width="1">
    <line x1="110" y1="360" x2="840" y2="360"/>
    <line x1="110" y1="300" x2="840" y2="300"/>
    <line x1="110" y1="240" x2="840" y2="240"/>
    <line x1="110" y1="180" x2="840" y2="180"/>
    <line x1="110" y1="120" x2="840" y2="120"/>
  </g>

  <rect x="180" y="163.2" width="150" height="256.8" rx="8" fill="#2563eb"/>
  <rect x="390" y="145.8" width="150" height="274.2" rx="8" fill="#16a34a"/>
  <rect x="600" y="175.2" width="150" height="244.8" rx="8" fill="#7c3aed"/>

  <g font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#111827" text-anchor="middle">
    <text x="255" y="149">85.6%</text>
    <text x="465" y="132">91.4%</text>
    <text x="675" y="162">81.6%</text>
  </g>
  <g font-family="Arial, sans-serif" font-size="17" fill="#374151" text-anchor="middle">
    <text x="255" y="455">Accuracy</text>
    <text x="465" y="455">F1</text>
    <text x="675" y="455">ROC-AUC</text>
  </g>
  <text x="840" y="500" font-family="Arial, sans-serif" font-size="12" fill="#9ca3af" text-anchor="end">Stored test metrics</text>
</svg>
